# Publishes the committed dist/ folder to GitHub Pages on every push to main (or master).
# It does NOT build the site (the build needs the local ../iammoody-export folder):
# run `npm run build` on your computer, commit dist/, then push.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish an unoptimized or empty build
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing. Run 'npm run build' and commit dist/."; exit 1; }
          heavy=$(find dist/media -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) | head -5)
          if [ -n "$heavy" ]; then
            echo "::error::dist/ still contains full-size JPG/PNG photos (the build's image optimization did not run). Rebuild with 'npm run build' (needs Python + Pillow), check for '67 photos optimized', commit dist/ again."
            echo "$heavy"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
